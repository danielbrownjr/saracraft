name: Controller unit tests
on:
  pull_request:
    paths:
      - 'controller/**'
      - '.github/workflows/controller-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
        working-directory: controller
      - name: Unit tests
        run: npm test
        working-directory: controller
