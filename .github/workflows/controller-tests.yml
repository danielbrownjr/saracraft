name: Controller and connection unit tests
on:
  pull_request:
    paths:
      - 'controller/**'
      - 'ops/**'
      - '.github/workflows/controller-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Controller syntax check
        run: npm run check
        working-directory: controller
      - name: Controller unit tests
        run: npm test
        working-directory: controller
      - name: Connection dependency installation
        run: npm ci --ignore-scripts
        working-directory: controller/connection
      - name: Connection syntax check
        run: |
          node --check main.js
          node --check connection.js
        working-directory: controller/connection
      - name: Connection unit tests
        run: npm test
        working-directory: controller/connection
      - name: Operations gateway syntax check
        run: npm run check
        working-directory: ops
      - name: Operations gateway tests
        run: npm test
        working-directory: ops
