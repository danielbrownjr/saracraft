name: Controller and connection unit tests
on:
  pull_request:
    paths:
      - 'controller/**'
      - 'ops/**'
      - '.github/workflows/controller-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.5'
      - name: Controller syntax check
        run: npm run check
        working-directory: controller
      - name: Connection dependency installation
        run: npm ci --ignore-scripts --no-bin-links
        working-directory: controller/connection
      - name: Symlink-free auth packaging smoke test
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d "${RUNNER_TEMP}/saracraft-auth-package.XXXXXXXX")"
          trap 'rm -rf -- "$stage"' EXIT
          mkdir -p "$stage/release/controller" "$stage/runtime/bin"
          cp -R controller/connection "$stage/release/controller/connection"
          cp -L "$(command -v node)" "$stage/runtime/bin/node"
          chmod 0755 "$stage/runtime/bin/node"
          test "$("$stage/runtime/bin/node" --version)" = "v22.23.5"
          python3 ops/auth/check_package_layout.py "$stage/release" "$stage/runtime"
          test ! -e "$stage/release/controller/connection/node_modules/.bin"
      - name: Controller and integration unit tests
        run: npm test
        working-directory: controller
      - name: Connection syntax check
        run: |
          node --check main.js
          node --check device-authorization.js
          node --check connection.js
          node --check runtime-config.js
          node --check movement.js
          node --check telemetry.js
        working-directory: controller/connection
      - name: Connection unit tests
        run: npm test
        working-directory: controller/connection
      - name: Restricted operations interface tests
        run: |
          python3 -m py_compile ops/saracraftctl ops/saracraftctl-priv
          python3 -m unittest discover -s ops/tests -v
      - name: Navigation safety syntax check
        run: node --check safety.js
        working-directory: controller/navigation
      - name: Navigation safety unit tests
        run: node --test safety.test.js
        working-directory: controller/navigation
