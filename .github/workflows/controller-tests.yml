name: Controller and connection unit tests
on:
  pull_request:
    paths:
      - 'controller/**'
      - '.github/workflows/controller-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.5'
      - name: Controller syntax check
        run: npm run check
        working-directory: controller
      - name: Connection dependency installation
        run: npm ci --ignore-scripts
        working-directory: controller/connection
      - name: Controller and integration unit tests
        run: npm test
        working-directory: controller
      - name: Connection syntax check
        run: |
          node --check main.js
          node --check connection.js
          node --check runtime-config.js
          node --check movement.js
          node --check telemetry.js
        working-directory: controller/connection
      - name: Connection unit tests
        run: npm test
        working-directory: controller/connection
      - name: Navigation safety syntax check
        run: node --check safety.js
        working-directory: controller/navigation
      - name: Navigation safety unit tests
        run: node --test safety.test.js
        working-directory: controller/navigation
